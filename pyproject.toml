[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "srdrone"
version = "0.2.0"
description = "Reconstructed SRDrone LLM task evaluation and behavior-tree refinement runtime"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
retrieval = ["sentence-transformers>=3.0,<6"]

[project.scripts]
srdrone = "srdrone.cli:main"

[tool.setuptools.packages.find]
include = ["srdrone*", "evaluator*", "reflector*", "workflow*"]
exclude = ["*.test*"]

[tool.setuptools.package-data]
srdrone = ["prompts/recovered/*.txt", "prompts/manifest.json", "data/frame_crossing/*.xml", "data/frame_crossing/*.txt", "data/frame_crossing/*.json"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
